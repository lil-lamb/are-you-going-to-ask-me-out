<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>are you going to ask me out?</title>
  <style>
    :root {
      --pink: #ff5d8f;
      --pink-dark: #e64577;
      --pink-soft: #ffe3ec;
      --ink: #3d2b34;
      --muted: #9a7f8b;
      --grey-bg: #e9e4e6;
      --grey-text: #a8a0a4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(160deg, #fff0f4 0%, #ffe3ec 55%, #ffd3e1 100%);
      color: var(--ink);
      display: flex;
      min-height: 100dvh;
      padding: 12px;
      overflow: hidden;
    }

    main {
      margin: auto;
      width: 100%;
      max-width: 720px;
      max-height: calc(100dvh - 24px);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(255, 93, 143, 0.18);
      padding: 32px 28px;
      text-align: center;
    }

    .screen { display: none; }
    .screen.active { display: block; margin: auto 0; animation: fadeUp 0.45s ease both; }
    #screen-flowers.screen.active { display: flex; flex-direction: column; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.65rem;
      line-height: 1.3;
      font-weight: 700;
      margin-bottom: 28px;
    }

    h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .subtitle {
      min-height: 1.5em;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      display: inline-block;
    }

    .btn-primary {
      background: var(--pink);
      color: #fff;
      box-shadow: 0 8px 20px rgba(255, 93, 143, 0.35);
    }
    .btn-primary:hover { background: var(--pink-dark); transform: translateY(-2px); }
    .btn-primary:active { transform: translateY(0); }

    .btn-ghost {
      background: #fff;
      color: var(--ink);
      border: 2px solid #f0c3d2;
    }
    .btn-ghost:hover { border-color: var(--pink); color: var(--pink-dark); }

    .btn-no { border-color: #f0c3d2; transform-origin: center; }
    .btn-no.shrunk-1 { transform: scale(0.85); }
    .btn-no.shrunk-2 { transform: scale(0.72); }
    .btn-no.disabled {
      transform: scale(0.6);
      background: var(--grey-bg);
      color: var(--grey-text);
      border-color: transparent;
      box-shadow: none;
      cursor: not-allowed;
      pointer-events: none;
      opacity: 0.8;
    }

    .btn-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

    .counter {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .pill {
      border: 2px solid #f0c3d2;
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill:hover { border-color: var(--pink); }
    .pill.selected { background: var(--pink); border-color: var(--pink); color: #fff; }
    .pill:disabled { opacity: 0.4; cursor: not-allowed; }

    .other-field {
      width: 100%;
      border: 2px solid #f0c3d2;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 1rem;
      color: var(--ink);
      background: #fff;
      margin-bottom: 20px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .other-field:focus { border-color: var(--pink); }

    .btn:disabled {
      background: var(--grey-bg);
      color: var(--grey-text);
      box-shadow: none;
      cursor: not-allowed;
      pointer-events: none;
    }

    .flee-area {
      position: relative;
      flex: 1 1 auto;
      min-height: 240px;
      margin-top: 8px;
      overflow: hidden; 
    }

    .flee-btn {
      position: absolute;
      top: 0;            
      left: 0;             
      border: none;
      border-radius: 999px;
      padding: 0 8px;
      height: 44px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      transition: box-shadow 0.2s ease;
      box-shadow: 0 6px 16px rgba(255, 93, 143, 0.28);
    }
    .flee-btn:hover { filter: brightness(1.08); }

    .footnote {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      main { padding: 24px 16px; border-radius: 18px; }
      h1 { font-size: 1.3rem; margin-bottom: 20px; }
      .btn { padding: 14px 30px; font-size: 1rem; }
      .btn-row { gap: 12px; }
      .flee-btn { padding: 16px 20px; min-width: 130px; font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <main>
    <!-- Screen 0: Fish name -->
    <section class="screen" id="screen-fish">
      <h1>what is the name of the fish?🐟</h1>
      <input type="text" class="other-field" id="fish-input" placeholder="type the fish's name…" autocomplete="off">
      <div id="fish-share" style="display:none;">
        <p class="counter" id="fish-share-hint"></p>
        <button class="btn btn-primary" id="fish-copy" style="margin-bottom:12px;">copy link 📋</button>
        <br>
        <button class="btn btn-ghost" id="fish-continue">continue →</button>
      </div>
      <button class="btn btn-primary" id="fish-go">continue</button>
    </section>

    <!-- Screen 1: The Ask -->
    <section class="screen" id="screen-ask">
      <h1 id="ask-title">are you going to ask me out, friend? 💗</h1>
      <p class="subtitle" id="no-subtitle">&nbsp;</p>
      <div class="btn-row">
        <button class="btn btn-primary" id="yes-btn">Yes</button>
        <button class="btn btn-ghost btn-no" id="no-btn">No</button>
      </div>
    </section>

    <!-- Screen 2: Date Plans -->
    <section class="screen" id="screen-plans">
      <h1>what do you plan to do on our date? 📅</h1>
      <p class="counter" id="pill-counter">0/3 selected</p>
      <div class="pills" id="pills"></div>
      <input type="text" class="other-field" id="other-input" placeholder="Other suggestion (optional)" autocomplete="off">
      <button class="btn btn-primary" id="plans-next" disabled>Next</button>
    </section>

    <!-- Screen 3: Flowers -->
    <section class="screen" id="screen-flowers">
      <h1>are you going to bring flowers? 💐</h1>
      <div class="flee-area" id="flee-area"></div>
    </section>

    <!-- Screen 4: Confirmation -->
    <section class="screen" id="screen-done">
      <h1 id="done-title">aw 🙈 you're so sweet!</h1>
      <p class="subtitle" id="done-message">Allllllright, I'll think about it and get back to you in 3–4 business days 😊</p>
      <button class="btn btn-primary" id="close-btn">close</button>
    </section>
  </main>

  <script>
    // ============ CONFIG ============
    const CONFIG = {
      askerName: "mister", // shows in "are you going to ask me out, {NAME}?"
      sheetWebAppUrl: "https://script.google.com/macros/s/AKfycbyDkP2s6Brvh6m5dz_s7LgE9ytDzh59O7Uy5i_JIeoLU_OvuZFP5m53xMqvbcCcw6UW/exec"
    };

    // ============ Screen switching ============
    const screens = {
      fish: document.getElementById("screen-fish"),
      ask: document.getElementById("screen-ask"),
      plans: document.getElementById("screen-plans"),
      flowers: document.getElementById("screen-flowers"),
      done: document.getElementById("screen-done")
    };

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove("active"));
      screens[name].classList.add("active");
      if (name === "flowers") layoutFleeButtons();
    }

    // ============ Screen 0: Fish name ============
    let fishName = "";
    const fishInput = document.getElementById("fish-input");
    const fishGo = document.getElementById("fish-go");
    const fishShare = document.getElementById("fish-share");
    const fishShareHint = document.getElementById("fish-share-hint");
    const fishCopy = document.getElementById("fish-copy");
    const fishContinue = document.getElementById("fish-continue");

    function updateAskTitle() {
      document.getElementById("ask-title").textContent =
        "are you going to ask me out, " + fishName + "? 💗";
    }

    const urlFish = new URLSearchParams(location.search).get("fish");
    if (urlFish) {
      fishName = urlFish.trim();
      updateAskTitle();
      showScreen("ask");
    } else {
      showScreen("fish");
    }

    function fishSubmitted() {
      fishName = fishInput.value.trim();
      if (!fishName) {
        fishInput.focus();
        return;
      }
      updateAskTitle();
      fishShareHint.textContent = "got it — " + fishName + "! send the link?";
      fishGo.style.display = "none";
      fishShare.style.display = "block";
    }

    fishGo.addEventListener("click", fishSubmitted);
    fishInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        fishSubmitted();
      }
    });

    fishCopy.addEventListener("click", async () => {
      const link = location.href.split("?")[0] + "?fish=" + encodeURIComponent(fishName);
      try {
        await navigator.clipboard.writeText(link);
        fishCopy.textContent = "copied ✓";
        setTimeout(() => { fishCopy.textContent = "copy link 📋"; }, 1600);
      } catch (_) {
        fishCopy.textContent = "couldn't copy — long-press: " + link;
      }
    });

    fishContinue.addEventListener("click", () => showScreen("ask"));

    // ============ Screen 1: The Ask ============

    let noClickCount = 0;
    const noBtn = document.getElementById("no-btn");
    const noSubtitle = document.getElementById("no-subtitle");

    const NO_MSGS = [
      "wait, seriously? 🥺",
      "are you sure? 😔",
      "you might really really really really really really super duper mega regret it 💔"
    ];

    noBtn.addEventListener("click", () => {
      noClickCount++;
      noSubtitle.textContent = NO_MSGS[Math.min(noClickCount - 1, NO_MSGS.length - 1)];
      if (noClickCount === 1) noBtn.classList.add("shrunk-1");
      if (noClickCount === 2) noBtn.classList.add("shrunk-2");
      if (noClickCount >= 3) {
        noBtn.classList.add("disabled");
        noBtn.disabled = true;
        noBtn.title = "The answer is yes.";
      }
    });

    document.getElementById("yes-btn").addEventListener("click", () => showScreen("plans"));

    // ============ Screen 2: Date Plans ============
    const OPTIONS = [
     "Dinner 🍽️", "Movie 🍿", "Walk in the park 🌳", "Coffee ☕", 
     "Museum/gallery 🖼️", "Game night 🎲", "Something adventurous 🧗", "Picnic 🧺", 
     "Cooking class 🧑‍🍳", "Live music/concert 🎶", "Thrift shopping 🛍️", "Stargazing ✨", 
     "Escape room 🧩", "Arcade/bowling 🎳", "Sunset view 🌅", "Pottery making 🏺", "Wine/beer tasting 🍷", 
     "Farmers market 🧺", "Ice/roller skating 🛼", "Kayaking/paddleboarding 🚣", "Comedy show 🎭", 
     "Trivia night 🧠", "Bookstore browsing 📚", "Dessert crawl 🍰", "Rock climbing 🧗‍♀️", "Mini golf ⛳", 
     "Drive-in theater 🚘", "Paint and sip 🎨", "Plant workshop 🪴"
    ];
    const MIN_PICKS = 2;
    const MAX_PICKS = 3;

    const pillsEl = document.getElementById("pills");
    const counterEl = document.getElementById("pill-counter");
    const nextBtn = document.getElementById("plans-next");
    const otherInput = document.getElementById("other-input");

    let selected = [];

    OPTIONS.forEach(label => {
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = "pill";
      pill.textContent = label;
      pill.addEventListener("click", () => {
        if (pill.disabled) return;
        const idx = selected.indexOf(label);
        if (idx !== -1) {
          selected.splice(idx, 1);
          pill.classList.remove("selected");
        } else {
          selected.push(label);
          pill.classList.add("selected");
        }
        syncPills();
      });
      pillsEl.appendChild(pill);
    });

    function syncPills() {
      counterEl.textContent = selected.length + "/" + MAX_PICKS + " selected";
      const all = pillsEl.querySelectorAll(".pill");
      all.forEach(p => {
        if (p.classList.contains("selected")) {
          p.disabled = false;
        } else {
          p.disabled = selected.length >= MAX_PICKS;
        }
      });
      nextBtn.disabled = selected.length < MIN_PICKS;
    }

    nextBtn.addEventListener("click", () => showScreen("flowers"));

    otherInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !nextBtn.disabled) {
        e.preventDefault();
        nextBtn.click();
      }
    });

    // ============ Screen 3: Flowers ============
    let broughtFlowers = false;
    const fleeArea = document.getElementById("flee-area");
    const PINK_SHADES = ["#ff75a0", "#ffb3c6", "#2a085c", "#7b2cbf", "#5a189a", "#c77dff", "#e056fd", "#c9184a"];
    const FLEE_LABELS = ["Yeppp", "Yes!!", "Mmm!!", "of course <3"];
    let fleeButtons = [];
    let mouseX = -9999, mouseY = -9999;
    let floatRaf = null;
    let areaCache = { w: 0, h: 0 };

    function layoutFleeButtons() {
      fleeButtons.forEach(b => b.el.remove());
      fleeButtons = [];
      const area = fleeArea.getBoundingClientRect();
      if (area.width < 10 || area.height < 10) return;
      areaCache.w = area.width;
      areaCache.h = area.height;
      const n = 30;
      const bw = Math.max(70, Math.min(110, area.width / 6));
      const bh = 44;
      for (let i = 0; i < n; i++) {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "flee-btn";
        el.textContent = FLEE_LABELS[i % FLEE_LABELS.length];
        el.style.background = PINK_SHADES[i % PINK_SHADES.length];
        el.style.width = bw + "px";
        el.style.height = bh + "px";
        el.addEventListener("click", () => {
          broughtFlowers = true;
          finalize();
        });
        fleeArea.appendChild(el);
        fleeButtons.push({
          el,
          w: bw,
          h: bh,
          x: Math.random() * (area.width - bw),
          y: Math.random() * (area.height - bh),
          vx: (Math.random() - 0.5) * 1.1,
          vy: (Math.random() - 0.5) * 1.1
        });
      }
      if (!floatRaf) floatRaf = requestAnimationFrame(floatLoop);
    }

    function floatLoop() {
      const areaW = areaCache.w, areaH = areaCache.h;
      const btns = fleeButtons;

      const FRICTION = 0.97;
      const MAX_SPEED = 4;

      for (const b of btns) {
        b.vx *= FRICTION;
        b.vy *= FRICTION;
        b.x += b.vx;
        b.y += b.vy;
      }
      for (let i = 0; i < btns.length; i++) {
        for (let j = i + 1; j < btns.length; j++) {
          const a = btns[i], b = btns[j];
          const ax = a.x + a.w / 2, ay = a.y + a.h / 2;
          const bx = b.x + b.w / 2, by = b.y + b.h / 2;
          const dx = bx - ax, dy = by - ay;
          const minD = (a.w + b.w) / 2;
          const dist = Math.hypot(dx, dy);
          if (dist > 0 && dist < minD) {
            const push = (minD - dist) / 2;
            const ux = dx / dist, uy = dy / dist;
            a.x -= ux * push; a.y -= uy * push;
            b.x += ux * push; b.y += uy * push;
          }
        }
      }
      const radius = 150;
      for (const b of btns) {
        const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
        const dx = cx - mouseX, dy = cy - mouseY;
        const dist = Math.hypot(dx, dy);
        if (dist < radius && dist > 0) {
          const force = ((radius - dist) / radius) * 3.5;
          const ux = dx / dist, uy = dy / dist;
          b.x += ux * force;
          b.y += uy * force;
          b.vx += ux * force * 0.06;
          b.vy += uy * force * 0.06;
        }

        const speed = Math.hypot(b.vx, b.vy);
        if (speed > MAX_SPEED) {
          b.vx = (b.vx / speed) * MAX_SPEED;
          b.vy = (b.vy / speed) * MAX_SPEED;
        }

        b.x = Math.max(0, Math.min(areaW - b.w, b.x));
        b.y = Math.max(0, Math.min(areaH - b.h, b.y));
        if (b.x <= 0) b.vx = Math.abs(b.vx) * 0.9;
        if (b.x >= areaW - b.w) b.vx = -Math.abs(b.vx) * 0.9;
        if (b.y <= 0) b.vy = Math.abs(b.vy) * 0.9;
        if (b.y >= areaH - b.h) b.vy = -Math.abs(b.vy) * 0.9;
        b.el.style.transform = "translate(" + b.x + "px," + b.y + "px)";
      }
      floatRaf = requestAnimationFrame(floatLoop);
    }

    const canHover = window.matchMedia("(hover: hover)").matches;

    if (canHover) {
      fleeArea.addEventListener("mousemove", (e) => {
        const area = fleeArea.getBoundingClientRect();
        mouseX = e.clientX - area.left;
        mouseY = e.clientY - area.top;
      });
      fleeArea.addEventListener("mouseleave", () => {
        mouseX = -9999;
        mouseY = -9999;
      });
    }

    const fleeResizeObserver = new ResizeObserver(layoutFleeButtons);
    fleeResizeObserver.observe(fleeArea);

    // Call this when leaving/tearing down screen 3 to stop the animation
    // loop and disconnect the observer, preventing leaks on re-entry.
    function teardownFleeScreen() {
      fleeResizeObserver.disconnect();
      if (floatRaf) {
        cancelAnimationFrame(floatRaf);
        floatRaf = null;
      }
      fleeButtons.forEach(b => b.el.remove());
      fleeButtons = [];
    }

    // ============ Screen 4: Confirmation + submission ============
    let submitted = false;
    function finalize() {
    const custom = otherInput.value.trim();
    let message = "wow 🤩 " + selected.join(", ");
    if (custom) message += `, aaaand: ${custom}👀`;
    message += "<br>Allllllright, I'll think about it and get back to you in 3–4 business days 😊";
    document.getElementById("done-message").innerHTML = message;
    showScreen("done");
    submitData(custom);
    }

    function submitData(customSuggestion) {
      if (submitted) return;
      submitted = true;

      if (!CONFIG.sheetWebAppUrl || CONFIG.sheetWebAppUrl.indexOf("PASTE_APPS_SCRIPT_URL_HERE") !== -1) {
        console.warn("[AskMeOut] sheetWebAppUrl not configured; skipping submission.");
        return;
      }

      const params = new URLSearchParams({
        fishName: fishName,
        noClicks: noClickCount,
        dateOptionsSelected: selected.join(","),
        customSuggestion: customSuggestion || "",
        broughtFlowers: broughtFlowers
      });

      const url = CONFIG.sheetWebAppUrl + "?" + params.toString();

      // Invisible image GET: plain image requests follow the redirect as GET,
      // hit doGet, and aren't subject to fetch/CORS/privacy blocking.
      try {
        const img = new Image();
        img.src = url;
      } catch (err) {
        console.error("[AskMeOut] submission failed:", err);
        try { fetch(url, { method: "GET", mode: "no-cors" }); } catch (_) {}
      }
    }

    // ============ Screen 4: Close button ============
    document.getElementById("close-btn").addEventListener("click", () => {
      window.open("", "_self", "");
      window.close();
      // If the browser blocks script-closing (user-opened tab), blank the
      // whole page so the tab visually closes anyway.
      setTimeout(() => {
        document.documentElement.remove();
      }, 300);
    });
  </script>
</body>
</html>
