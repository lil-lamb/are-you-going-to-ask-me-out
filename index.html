<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>are you going to ask me out?</title>
  <style>
    :root {
      --pink: #ff5d8f;
      --pink-dark: #e64577;
      --pink-soft: #ffe3ec;
      --ink: #3d2b34;
      --muted: #9a7f8b;
      --grey-bg: #e9e4e6;
      --grey-text: #a8a0a4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(160deg, #fff0f4 0%, #ffe3ec 55%, #ffd3e1 100%);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(255, 93, 143, 0.18);
      padding: 40px 28px;
      text-align: center;
    }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeUp 0.45s ease both; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.65rem;
      line-height: 1.3;
      font-weight: 700;
      margin-bottom: 28px;
    }

    h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .subtitle {
      min-height: 1.5em;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      display: inline-block;
    }

    .btn-primary {
      background: var(--pink);
      color: #fff;
      box-shadow: 0 8px 20px rgba(255, 93, 143, 0.35);
    }
    .btn-primary:hover { background: var(--pink-dark); transform: translateY(-2px); }
    .btn-primary:active { transform: translateY(0); }

    .btn-ghost {
      background: #fff;
      color: var(--ink);
      border: 2px solid #f0c3d2;
    }
    .btn-ghost:hover { border-color: var(--pink); color: var(--pink-dark); }

    .btn-no { border-color: #f0c3d2; transform-origin: center; }
    .btn-no.shrunk-1 { transform: scale(0.85); }
    .btn-no.shrunk-2 { transform: scale(0.72); }
    .btn-no.disabled {
      transform: scale(0.6);
      background: var(--grey-bg);
      color: var(--grey-text);
      border-color: transparent;
      box-shadow: none;
      cursor: not-allowed;
      pointer-events: none;
      opacity: 0.8;
    }

    .btn-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

    .counter {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .pill {
      border: 2px solid #f0c3d2;
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill:hover { border-color: var(--pink); }
    .pill.selected { background: var(--pink); border-color: var(--pink); color: #fff; }
    .pill:disabled { opacity: 0.4; cursor: not-allowed; }

    .other-field {
      width: 100%;
      border: 2px solid #f0c3d2;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 1rem;
      color: var(--ink);
      background: #fff;
      margin-bottom: 20px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .other-field:focus { border-color: var(--pink); }

    .btn:disabled {
      background: var(--grey-bg);
      color: var(--grey-text);
      box-shadow: none;
      cursor: not-allowed;
      pointer-events: none;
    }

    .footnote {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <!-- Screen 1: The Ask -->
    <section class="screen active" id="screen-ask">
      <h1 id="ask-title">are you going to ask me out?</h1>
      <p class="subtitle" id="no-subtitle">&nbsp;</p>
      <div class="btn-row">
        <button class="btn btn-primary" id="yes-btn">Yes</button>
        <button class="btn btn-ghost btn-no" id="no-btn">No</button>
      </div>
    </section>

    <!-- Screen 2: Date Plans -->
    <section class="screen" id="screen-plans">
      <h1>what do you plan to do on our date?</h1>
      <p class="counter" id="pill-counter">0/3 selected</p>
      <div class="pills" id="pills"></div>
      <input type="text" class="other-field" id="other-input" placeholder="Other suggestion (optional)" autocomplete="off">
      <button class="btn btn-primary" id="plans-next" disabled>Next</button>
    </section>

    <!-- Screen 3: Flowers -->
    <section class="screen" id="screen-flowers">
      <h1>are you going to bring flowers?</h1>
      <button class="btn btn-primary" id="flowers-yes">Yes</button>
    </section>

    <!-- Screen 4: Confirmation -->
    <section class="screen" id="screen-done">
      <h1 id="done-title">got it — thanks!</h1>
      <p class="subtitle" id="done-message">I'll think about it and get back to you in 3–4 business days 😏</p>
    </section>
  </main>

  <script>
    // ============ CONFIG ============
    const CONFIG = {
      askerName: "Mister", // shows in "are you going to ask me out, {NAME}?"
      sheetWebAppUrl: "https://script.google.com/macros/s/AKfycbwt89pwS4EMb7D0U0ghHMAb8pNujbb7QJUrV8lYYNk3qVsflhASRuOpyshQb2ZoHNkh/exec"
    };

    // ============ Screen switching ============
    const screens = {
      ask: document.getElementById("screen-ask"),
      plans: document.getElementById("screen-plans"),
      flowers: document.getElementById("screen-flowers"),
      done: document.getElementById("screen-done")
    };

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove("active"));
      screens[name].classList.add("active");
    }

    // ============ Screen 1: The Ask ============
    document.getElementById("ask-title").textContent =
      "are you going to ask me out, " + CONFIG.askerName + "?";

    let noClickCount = 0;
    const noBtn = document.getElementById("no-btn");
    const noSubtitle = document.getElementById("no-subtitle");

    const NO_MSGS = [
      "wait, really? 🥺",
      "am I not pretty?",
      "is it something I said?"
    ];

    noBtn.addEventListener("click", () => {
      noClickCount++;
      noSubtitle.textContent = NO_MSGS[Math.min(noClickCount - 1, NO_MSGS.length - 1)];
      if (noClickCount === 1) noBtn.classList.add("shrunk-1");
      if (noClickCount === 2) noBtn.classList.add("shrunk-2");
      if (noClickCount >= 3) {
        noBtn.classList.add("disabled");
        noBtn.disabled = true;
        noBtn.title = "The answer is yes.";
      }
    });

    document.getElementById("yes-btn").addEventListener("click", () => showScreen("plans"));

    // ============ Screen 2: Date Plans ============
    const OPTIONS = [
      "Dinner", "Movie", "Walk in the park", "Coffee",
      "Museum/gallery", "Game night", "Something adventurous"
    ];
    const MIN_PICKS = 2;
    const MAX_PICKS = 3;

    const pillsEl = document.getElementById("pills");
    const counterEl = document.getElementById("pill-counter");
    const nextBtn = document.getElementById("plans-next");
    const otherInput = document.getElementById("other-input");

    let selected = [];

    OPTIONS.forEach(label => {
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = "pill";
      pill.textContent = label;
      pill.addEventListener("click", () => {
        if (pill.disabled) return;
        const idx = selected.indexOf(label);
        if (idx !== -1) {
          selected.splice(idx, 1);
          pill.classList.remove("selected");
        } else {
          selected.push(label);
          pill.classList.add("selected");
        }
        syncPills();
      });
      pillsEl.appendChild(pill);
    });

    function syncPills() {
      counterEl.textContent = selected.length + "/" + MAX_PICKS + " selected";
      const all = pillsEl.querySelectorAll(".pill");
      all.forEach(p => {
        if (p.classList.contains("selected")) {
          p.disabled = false;
        } else {
          p.disabled = selected.length >= MAX_PICKS;
        }
      });
      nextBtn.disabled = selected.length < MIN_PICKS;
    }

    nextBtn.addEventListener("click", () => showScreen("flowers"));

    // ============ Screen 3: Flowers ============
    let broughtFlowers = false;
    document.getElementById("flowers-yes").addEventListener("click", () => {
      broughtFlowers = true;
      finalize();
    });

    // ============ Screen 4: Confirmation + submission ============
    let submitted = false;

    function finalize() {
      const custom = otherInput.value.trim();

      let message = "got it — " + selected.join(", ");
      if (custom) message += ", and your idea: " + custom;
      message += ". thanks! I'll think about it and get back to you in 3–4 business days 😏";

      document.getElementById("done-message").textContent = message;
      showScreen("done");
      submitData(custom);
    }

    function submitData(customSuggestion) {
      if (submitted) return;
      submitted = true;

      if (!CONFIG.sheetWebAppUrl || CONFIG.sheetWebAppUrl.indexOf("PASTE_APPS_SCRIPT_URL_HERE") !== -1) {
        console.warn("[AskMeOut] sheetWebAppUrl not configured; skipping submission.");
        return;
      }

      const payload = {
        noClicks: noClickCount,
        dateOptionsSelected: selected.slice(),
        customSuggestion: customSuggestion || "",
        broughtFlowers: broughtFlowers
      };

      fetch(CONFIG.sheetWebAppUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }).catch(err => console.error("[AskMeOut] submission failed:", err));
    }
  </script>
</body>
</html>
