<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>are you going to ask me out?</title>
  <style>
    :root {
      --pink: #ff5d8f;
      --pink-dark: #e64577;
      --pink-soft: #ffe3ec;
      --ink: #3d2b34;
      --muted: #9a7f8b;
      --grey-bg: #e9e4e6;
      --grey-text: #a8a0a4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(160deg, #fff0f4 0%, #ffe3ec 55%, #ffd3e1 100%);
      color: var(--ink);
      display: flex;
      min-height: 100dvh;
      padding: 12px;
      overflow: hidden;
    }

    main {
      margin: auto;
      width: 100%;
      max-width: 720px;
      max-height: calc(100dvh - 24px);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(255, 93, 143, 0.18);
      padding: 32px 28px;
      text-align: center;
    }

    .screen { display: none; }
    .screen.active { display: block; margin: auto 0; animation: fadeUp 0.45s ease both; }
    #screen-flowers.screen.active { display: flex; flex-direction: column; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.65rem;
      line-height: 1.3;
      font-weight: 700;
      margin-bottom: 28px;
    }

    h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .subtitle {
      min-height: 1.5em;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      display: inline-block;
    }

    .btn-primary {
      background: var(--pink);
      color: #fff;
      box-shadow: 0 8px 20px rgba(255, 93, 143, 0.35);
    }
    .btn-primary:hover { background: var(--pink-dark); transform: translateY(-2px); }
    .btn-primary:active { transform: translateY(0); }

    .btn-ghost {
      background: #fff;
      color: var(--ink);
      border: 2px solid #f0c3d2;
    }
    .btn-ghost:hover { border-color: var(--pink); color: var(--pink-dark); }

    .btn-no { border-color: #f0c3d2; transform-origin: center; }
    .btn-no.shrunk-1 { transform: scale(0.85); }
    .btn-no.shrunk-2 { transform: scale(0.72); }
    .btn-no.disabled {
      transform: scale(0.6);
      background: var(--grey-bg);
      color: var(--grey-text);
      border-color: transparent;
      box-shadow: none;
      cursor: not-allowed;
      pointer-events: none;
      opacity: 0.8;
    }

    .btn-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

    .counter {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .pill {
      border: 2px solid #f0c3d2;
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill:hover { border-color: var(--pink); }
    .pill.selected { background: var(--pink); border-color: var(--pink); color: #fff; }
    .pill:disabled { opacity: 0.4; cursor: not-allowed; }

    .other-field {
      width: 100%;
      border: 2px solid #f0c3d2;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 1rem;
      color: var(--ink);
      background: #fff;
      margin-bottom: 20px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .other-field:focus { border-color: var(--pink); }

    .btn:disabled {
      background: var(--grey-bg);
      color: var(--grey-text);
      box-shadow: none;
      cursor: not-allowed;
      pointer-events: none;
    }

    .flee-area {
      position: relative;
      flex: 1 1 auto;
      min-height: 240px;
      margin-top: 8px;
    }

    .flee-btn {
      position: absolute;
      border: none;
      border-radius: 999px;
      padding: 0 8px;
      height: 44px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      transition: transform 0.18s ease-out, box-shadow 0.2s ease;
      box-shadow: 0 6px 16px rgba(255, 93, 143, 0.28);
    }
    .flee-btn:hover { filter: brightness(1.08); }

    .footnote {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      main { padding: 24px 16px; border-radius: 18px; }
      h1 { font-size: 1.3rem; margin-bottom: 20px; }
      .btn { padding: 14px 30px; font-size: 1rem; }
      .btn-row { gap: 12px; }
      .flee-btn { padding: 16px 20px; min-width: 130px; font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <main>
    <!-- Screen 1: The Ask -->
    <section class="screen active" id="screen-ask">
      <h1 id="ask-title">are you going to ask me out? 💗</h1>
      <p class="subtitle" id="no-subtitle">&nbsp;</p>
      <div class="btn-row">
        <button class="btn btn-primary" id="yes-btn">Yes</button>
        <button class="btn btn-ghost btn-no" id="no-btn">No</button>
      </div>
    </section>

    <!-- Screen 2: Date Plans -->
    <section class="screen" id="screen-plans">
      <h1>what do you plan to do on our date? 📅</h1>
      <p class="counter" id="pill-counter">0/3 selected</p>
      <div class="pills" id="pills"></div>
      <input type="text" class="other-field" id="other-input" placeholder="Other suggestion (optional)" autocomplete="off">
      <button class="btn btn-primary" id="plans-next" disabled>Next</button>
    </section>

    <!-- Screen 3: Flowers -->
    <section class="screen" id="screen-flowers">
      <h1>are you going to bring flowers? 💐</h1>
      <div class="flee-area" id="flee-area"></div>
    </section>

    <!-- Screen 4: Confirmation -->
    <section class="screen" id="screen-done">
      <h1 id="done-title">aw 🙈 you're so sweet!</h1>
      <p class="subtitle" id="done-message">Allllllright, I'll think about it and get back to you in 3–4 business days 😊</p>
      <button class="btn btn-primary" id="close-btn">close</button>
    </section>
  </main>

  <script>
    // ============ CONFIG ============
    const CONFIG = {
      askerName: "mister", // shows in "are you going to ask me out, {NAME}?"
      sheetWebAppUrl: "https://script.google.com/macros/s/AKfycbyDkP2s6Brvh6m5dz_s7LgE9ytDzh59O7Uy5i_JIeoLU_OvuZFP5m53xMqvbcCcw6UW/exec"
    };

    // ============ Screen switching ============
    const screens = {
      ask: document.getElementById("screen-ask"),
      plans: document.getElementById("screen-plans"),
      flowers: document.getElementById("screen-flowers"),
      done: document.getElementById("screen-done")
    };

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove("active"));
      screens[name].classList.add("active");
      if (name === "flowers") layoutFleeButtons();
    }

    // ============ Screen 1: The Ask ============
    document.getElementById("ask-title").textContent =
      "are you going to ask me out, " + CONFIG.askerName + "?";

    let noClickCount = 0;
    const noBtn = document.getElementById("no-btn");
    const noSubtitle = document.getElementById("no-subtitle");

    const NO_MSGS = [
      "wait, seriously? 🥺",
      "are you sure? 😔",
      "you certain that you really really really really really really super duper mega won't regret it? 💔"
    ];

    noBtn.addEventListener("click", () => {
      noClickCount++;
      noSubtitle.textContent = NO_MSGS[Math.min(noClickCount - 1, NO_MSGS.length - 1)];
      if (noClickCount === 1) noBtn.classList.add("shrunk-1");
      if (noClickCount === 2) noBtn.classList.add("shrunk-2");
      if (noClickCount >= 3) {
        noBtn.classList.add("disabled");
        noBtn.disabled = true;
        noBtn.title = "The answer is yes.";
      }
    });

    document.getElementById("yes-btn").addEventListener("click", () => showScreen("plans"));

    // ============ Screen 2: Date Plans ============
    const OPTIONS = [
     "Dinner 🍽️", "Movie 🍿", "Walk in the park 🌳", "Coffee ☕", 
     "Museum/gallery 🖼️", "Game night 🎲", "Something adventurous 🧗", "Picnic 🧺", 
     "Cooking class 🧑‍🍳", "Live music/concert 🎶", "Thrift shopping 🛍️", "Stargazing ✨", 
     "Escape room 🧩", "Arcade/bowling 🎳", "Sunset view 🌅", "Pottery making 🏺", "Wine/beer tasting 🍷", 
     "Farmers market 🧺", "Ice/roller skating 🛼", "Kayaking/paddleboarding 🚣", "Comedy show 🎭", 
     "Trivia night 🧠", "Bookstore browsing 📚", "Dessert crawl 🍰", "Rock climbing 🧗‍♀️", "Mini golf ⛳", 
     "Drive-in theater 🚘", "Paint and sip 🎨", "Plant workshop 🪴"
    ];
    const MIN_PICKS = 2;
    const MAX_PICKS = 3;

    const pillsEl = document.getElementById("pills");
    const counterEl = document.getElementById("pill-counter");
    const nextBtn = document.getElementById("plans-next");
    const otherInput = document.getElementById("other-input");

    let selected = [];

    OPTIONS.forEach(label => {
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = "pill";
      pill.textContent = label;
      pill.addEventListener("click", () => {
        if (pill.disabled) return;
        const idx = selected.indexOf(label);
        if (idx !== -1) {
          selected.splice(idx, 1);
          pill.classList.remove("selected");
        } else {
          selected.push(label);
          pill.classList.add("selected");
        }
        syncPills();
      });
      pillsEl.appendChild(pill);
    });

    function syncPills() {
      counterEl.textContent = selected.length + "/" + MAX_PICKS + " selected";
      const all = pillsEl.querySelectorAll(".pill");
      all.forEach(p => {
        if (p.classList.contains("selected")) {
          p.disabled = false;
        } else {
          p.disabled = selected.length >= MAX_PICKS;
        }
      });
      nextBtn.disabled = selected.length < MIN_PICKS;
    }

    nextBtn.addEventListener("click", () => showScreen("flowers"));

    otherInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !nextBtn.disabled) {
        e.preventDefault();
        nextBtn.click();
      }
    });

    // ============ Screen 3: Flowers ============
    let broughtFlowers = false;
    const fleeArea = document.getElementById("flee-area");
    const PINK_SHADES = ["#ff75a0", "#ffb3c6", "#2a085c", "#7b2cbf", "#5a189a", "#c77dff", "#e056fd", "#c9184a"];
    const FLEE_LABELS = ["Yeppp", "Yes!!", "Mmm!!", "of course <3"];
    let fleeButtons = [];

    function layoutFleeButtons() {
      fleeButtons.forEach(b => b.remove());
      fleeButtons = [];
      const area = fleeArea.getBoundingClientRect();
      if (area.width < 10 || area.height < 10) return;
      const n = 30;
      const cols = Math.max(2, Math.min(6, Math.floor(area.width / 105)));
      const maxRows = Math.max(2, Math.floor(area.height / 48));
      const count = Math.min(n, cols * maxRows);
      const rows = Math.ceil(count / cols);
      const cellW = area.width / cols;
      const cellH = area.height / rows;
      const bw = Math.max(70, Math.min(110, cellW - 10));
      const bh = Math.max(36, Math.min(44, cellH - 6));
      for (let i = 0; i < count; i++) {
        const r = Math.floor(i / cols);
        const c = i % cols;
        const cellLeft = c * cellW;
        const cellTop = r * cellH;
        const jx = 6 + Math.random() * Math.max(cellW - bw - 12, 4);
        const jy = 4 + Math.random() * Math.max(cellH - bh - 8, 4);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "flee-btn";
        btn.textContent = FLEE_LABELS[i % FLEE_LABELS.length];
        btn.style.background = PINK_SHADES[i % PINK_SHADES.length];
        const x = cellLeft + jx;
        const y = cellTop + jy;
        btn.style.left = x + "px";
        btn.style.top = y + "px";
        btn.style.width = bw + "px";
        btn.style.height = bh + "px";
        btn.dataset.baseX = x;
        btn.dataset.baseY = y;
        btn.dataset.cellLeft = cellLeft;
        btn.dataset.cellTop = cellTop;
        btn.dataset.cellW = cellW;
        btn.dataset.cellH = cellH;
        btn.dataset.bw = bw;
        btn.dataset.bh = bh;
        btn.addEventListener("click", () => {
          broughtFlowers = true;
          finalize();
        });
        fleeArea.appendChild(btn);
        fleeButtons.push(btn);
      }
    }

    const canHover = window.matchMedia("(hover: hover)").matches;

    if (canHover) {
      fleeArea.addEventListener("mousemove", (e) => {
        const area = fleeArea.getBoundingClientRect();
        const cx = e.clientX - area.left;
        const cy = e.clientY - area.top;
        const radius = 180;
        for (const btn of fleeButtons) {
          const b = btn.getBoundingClientRect();
          const bx = b.left - area.left;
          const by = b.top - area.top;
          const dx = bx + b.width / 2 - cx;
          const dy = by + b.height / 2 - cy;
          const dist = Math.hypot(dx, dy);
          if (dist < radius && dist > 0) {
            const push = radius - dist;
            let nx = bx + (dx / dist) * push;
            let ny = by + (dy / dist) * push;
            const left = +btn.dataset.cellLeft;
            const top = +btn.dataset.cellTop;
            const bw = +btn.dataset.bw;
            const bh = +btn.dataset.bh;
            nx = Math.max(left, Math.min(left + (+btn.dataset.cellW) - bw, nx));
            ny = Math.max(top, Math.min(top + (+btn.dataset.cellH) - bh, ny));
            btn.style.transform = "translate(" + (nx - +btn.dataset.baseX) + "px," + (ny - +btn.dataset.baseY) + "px)";
          }
        }
      });
    }

    new ResizeObserver(layoutFleeButtons).observe(fleeArea);

    // ============ Screen 4: Confirmation + submission ============
    let submitted = false;
    function finalize() {
    const custom = otherInput.value.trim();
    let message = "wow 🤩 " + selected.join(", ");
    if (custom) message += `, aaaand: ${custom}👀`;
    message += "<br>Allllllright, I'll think about it and get back to you in 3–4 business days 😊";
    document.getElementById("done-message").innerHTML = message;
    showScreen("done");
    submitData(custom);
    }

    function submitData(customSuggestion) {
      if (submitted) return;
      submitted = true;

      if (!CONFIG.sheetWebAppUrl || CONFIG.sheetWebAppUrl.indexOf("https://script.google.com/macros/s/AKfycbyDkP2s6Brvh6m5dz_s7LgE9ytDzh59O7Uy5i_JIeoLU_OvuZFP5m53xMqvbcCcw6UW/exec") !== -1) {
        console.warn("[AskMeOut] sheetWebAppUrl not configured; skipping submission.");
        return;
      }

      const payload = {
        noClicks: noClickCount,
        dateOptionsSelected: selected.slice(),
        customSuggestion: customSuggestion || "",
        broughtFlowers: broughtFlowers
      };

      fetch(CONFIG.sheetWebAppUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }).catch(err => console.error("[AskMeOut] submission failed:", err));
    }

    // ============ Screen 4: Close button ============
    document.getElementById("close-btn").addEventListener("click", () => {
      window.open("", "_self", "");
      window.close();
    });
  </script>
</body>
</html>
